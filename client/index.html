<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="乐龄健康资讯 - 专业可信的中老年健康、养生、慢病管理知识平台">
  <title>乐龄健康 - 科学养生每一天</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 顶部导航栏 -->
    <header class="header" id="header">
      <div class="header-inner">
        <h1 class="header-title" id="headerTitle">乐龄健康</h1>
        <div class="header-actions">
          <button class="btn-icon" id="btnSearch" aria-label="搜索">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
          </button>
          <button class="btn-icon" id="btnRefresh" aria-label="刷新">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
              <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
            </svg>
          </button>
        </div>
      </div>
      <!-- 搜索框 -->
      <div class="search-bar" id="searchBar">
        <input type="text" id="searchInput" placeholder="搜索健康资讯..." autocomplete="off">
        <button class="btn-search-cancel" id="btnSearchCancel">取消</button>
      </div>
    </header>

    <!-- 分类导航 -->
    <nav class="category-nav" id="categoryNav">
      <div class="category-scroll">
        <button class="category-tab active" data-category="all">全部</button>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
      <!-- 首页文章列表视图 -->
      <div class="view active" id="viewList">
        <!-- 今日推荐 -->
        <section class="section" id="featuredSection">
          <h2 class="section-title">今日推荐</h2>
          <div class="featured-card" id="featuredCard">
            <div class="skeleton skeleton-featured"></div>
          </div>
        </section>

        <!-- 最新资讯 -->
        <section class="section">
          <h2 class="section-title">最新资讯</h2>
          <div class="article-list" id="articleList">
            <div class="skeleton skeleton-article"></div>
            <div class="skeleton skeleton-article"></div>
            <div class="skeleton skeleton-article"></div>
          </div>
          <div class="load-more" id="loadMore">
            <button class="btn-load-more" id="btnLoadMore">加载更多</button>
          </div>
        </section>
      </div>

      <!-- 文章详情视图 -->
      <div class="view" id="viewDetail">
        <article class="article-detail" id="articleDetail"></article>
      </div>
    </main>

    <!-- 底部标签栏 -->
    <footer class="tab-bar" id="tabBar">
      <button class="tab-item active" data-tab="home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        <span>首页</span>
      </button>
      <button class="tab-item" data-tab="categories">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        <span>分类</span>
      </button>
      <button class="tab-item" data-tab="trending">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
        </svg>
        <span>热门</span>
      </button>
      <button class="tab-item" data-tab="profile">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </button>
    </footer>

    <!-- 分类页面 -->
    <div class="page" id="pageCats">
      <div class="page-header">
        <button class="btn-back" id="btnBackFromCats">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <h2>健康分类</h2>
      </div>
      <div class="category-grid" id="categoryGrid"></div>
    </div>

    <!-- 热门页面 -->
    <div class="page" id="pageTrending">
      <div class="page-header">
        <button class="btn-back" id="btnBackFromTrending">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <h2>热门资讯</h2>
      </div>
      <div style="flex:1;overflow-y:auto;padding:var(--space-lg);">
        <div class="article-list" id="trendingList"></div>
      </div>
    </div>

    <!-- 个人页面 -->
    <div class="page" id="pageProfile">
      <div class="page-header">
        <button class="btn-back" id="btnBackFromProfile">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <h2>我的</h2>
      </div>
      <div class="profile-content">
        <div class="profile-card">
          <div class="profile-avatar">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#c0392b" stroke-width="1.5">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <h3>健康生活家</h3>
          <p class="profile-subtitle">关注健康，科学养生</p>
          <span class="membership-badge free" id="memberBadge">免费用户</span>
        </div>
        <div class="profile-stats" id="profileStats">
          <div class="stat-item">
            <span class="stat-number" id="statRead">0</span>
            <span class="stat-label">已阅读</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" id="statLiked">0</span>
            <span class="stat-label">已点赞</span>
          </div>
          <div class="stat-item">
            <span class="stat-number" id="statShared">0</span>
            <span class="stat-label">已分享</span>
          </div>
        </div>
        <div class="profile-menu">
          <div class="menu-item">
            <span>字体大小</span>
            <div class="font-size-control">
              <button class="btn-font" id="btnFontSmall">小</button>
              <button class="btn-font" id="btnFontMedium">中</button>
              <button class="btn-font active" id="btnFontLarge">大</button>
              <button class="btn-font" id="btnFontXlarge">特大</button>
            </div>
          </div>
          <div class="menu-item">
            <span>阅读历史</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </div>
          <div class="menu-item">
            <span>关于我们</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
